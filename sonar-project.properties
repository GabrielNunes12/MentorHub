sonar.organization=gabrielnunes12
sonar.projectKey=GabrielNunes12_MentorHub
sonar.projectName=MentorHub

# Unified project: frontend (src) + backend (server.ts, api) share one quality gate.
sonar.sources=src,server.ts,api
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**,dist/**,node_modules/**,coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
